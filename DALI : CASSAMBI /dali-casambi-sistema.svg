<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 400" fill="none" aria-hidden="true">
  <defs>
    <style>
      .dc-label {
        font-family: Montserrat, -apple-system, BlinkMacSystemFont, sans-serif;
        font-size: 7px;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      .dc-label--sm { font-size: 6px; letter-spacing: 0.06em; }
      .dc-label--muted { fill: rgba(255, 255, 255, 0.55); }
      .dc-label--dali { fill: #e8943a; }
      .dc-label--casambi { fill: #00b4d8; }
      .dc-stroke { stroke: rgba(255, 255, 255, 0.32); }
      .dc-stroke--dali { stroke: rgba(232, 148, 58, 0.55); }
      .dc-stroke--casambi { stroke: rgba(0, 180, 216, 0.55); }
      .dc-stroke--mesh { stroke: rgba(0, 180, 216, 0.3); stroke-dasharray: 3 2.5; }
      .dc-frame { fill: rgba(255, 255, 255, 0.04); stroke: rgba(255, 255, 255, 0.2); }
      .dc-frame--dali { fill: rgba(232, 148, 58, 0.06); stroke: rgba(232, 148, 58, 0.38); }
      .dc-frame--casambi { fill: rgba(0, 180, 216, 0.06); stroke: rgba(0, 180, 216, 0.38); }
      .dc-fill-dali { fill: rgba(232, 148, 58, 0.9); }
      .dc-fill-casambi { fill: rgba(0, 180, 216, 0.9); }
      .dc-fill-node { fill: rgba(255, 255, 255, 0.08); stroke: rgba(255, 255, 255, 0.26); }
    </style>
  </defs>

  <!-- CONTROL DALI -->
  <rect x="96" y="10" width="128" height="54" rx="7" class="dc-frame" stroke-width="1.2"/>
  <g transform="translate(160 28)">
    <rect x="-18" y="-12" width="36" height="22" rx="2.5" class="dc-fill-node" stroke-width="1"/>
    <rect x="-14" y="-9" width="28" height="16" rx="1.5" fill="rgba(255,255,255,0.06)"/>
    <rect x="-12" y="14" width="24" height="4" rx="1" fill="rgba(255,255,255,0.1)"/>
  </g>
  <text x="160" y="56" text-anchor="middle" class="dc-label dc-label--muted">CONTROL DALI</text>

  <!-- BUS -->
  <line x1="160" y1="64" x2="160" y2="78" class="dc-stroke" stroke-width="1.4"/>
  <line x1="28" y1="78" x2="292" y2="78" class="dc-stroke" stroke-width="1.4"/>
  <text x="160" y="75" text-anchor="middle" class="dc-label dc-label--sm dc-label--muted">BUS DALI</text>

  <!-- MASTER boxes -->
  <rect x="14" y="86" width="88" height="28" rx="5" class="dc-fill-node" stroke-width="1.1"/>
  <text x="58" y="104" text-anchor="middle" class="dc-label dc-label--sm dc-label--muted">MASTER DALI</text>

  <rect x="116" y="86" width="88" height="28" rx="5" class="dc-fill-node" stroke-width="1.1"/>
  <text x="160" y="104" text-anchor="middle" class="dc-label dc-label--sm dc-label--muted">MASTER DALI</text>

  <rect x="218" y="86" width="88" height="28" rx="5" class="dc-fill-node" stroke-width="1.1"/>
  <text x="262" y="104" text-anchor="middle" class="dc-label dc-label--sm dc-label--muted">MASTER DALI</text>

  <line x1="58" y1="78" x2="58" y2="86" class="dc-stroke" stroke-width="1.3"/>
  <line x1="160" y1="78" x2="160" y2="86" class="dc-stroke" stroke-width="1.3"/>
  <line x1="262" y1="78" x2="262" y2="86" class="dc-stroke" stroke-width="1.3"/>

  <!-- Luminarias cableadas — col 1 -->
  <rect x="10" y="122" width="96" height="118" rx="7" class="dc-frame--dali" stroke-width="1.2"/>
  <line x1="58" y1="114" x2="58" y2="122" class="dc-stroke--dali" stroke-width="1.3"/>
  <g transform="translate(32 148)">
    <rect width="9" height="9" rx="1.5" class="dc-fill-dali"/><rect x="13" width="9" height="9" rx="1.5" class="dc-fill-dali"/><rect x="26" width="9" height="9" rx="1.5" class="dc-fill-dali"/>
    <rect y="13" width="9" height="9" rx="1.5" class="dc-fill-dali"/><rect x="13" y="13" width="9" height="9" rx="1.5" class="dc-fill-dali"/><rect x="26" y="13" width="9" height="9" rx="1.5" class="dc-fill-dali"/>
    <rect y="26" width="9" height="9" rx="1.5" class="dc-fill-dali"/><rect x="13" y="26" width="9" height="9" rx="1.5" class="dc-fill-dali"/><rect x="26" y="26" width="9" height="9" rx="1.5" class="dc-fill-dali"/>
  </g>
  <text x="58" y="228" text-anchor="middle" class="dc-label dc-label--sm dc-label--dali">LUMINARIAS</text>

  <!-- Luminarias cableadas — col 2 -->
  <rect x="112" y="122" width="96" height="118" rx="7" class="dc-frame--dali" stroke-width="1.2"/>
  <line x1="160" y1="114" x2="160" y2="122" class="dc-stroke--dali" stroke-width="1.3"/>
  <g transform="translate(134 148)">
    <rect width="9" height="9" rx="1.5" class="dc-fill-dali"/><rect x="13" width="9" height="9" rx="1.5" class="dc-fill-dali"/><rect x="26" width="9" height="9" rx="1.5" class="dc-fill-dali"/>
    <rect y="13" width="9" height="9" rx="1.5" class="dc-fill-dali"/><rect x="13" y="13" width="9" height="9" rx="1.5" class="dc-fill-dali"/><rect x="26" y="13" width="9" height="9" rx="1.5" class="dc-fill-dali"/>
    <rect y="26" width="9" height="9" rx="1.5" class="dc-fill-dali"/><rect x="13" y="26" width="9" height="9" rx="1.5" class="dc-fill-dali"/><rect x="26" y="26" width="9" height="9" rx="1.5" class="dc-fill-dali"/>
  </g>
  <text x="160" y="228" text-anchor="middle" class="dc-label dc-label--sm dc-label--dali">LUMINARIAS</text>

  <!-- Zona Casambi — col 3 -->
  <rect x="214" y="122" width="96" height="268" rx="7" class="dc-frame--casambi" stroke-width="1.2"/>
  <line x1="262" y1="114" x2="262" y2="122" class="dc-stroke--casambi" stroke-width="1.3"/>

  <!-- Pasarela -->
  <rect x="222" y="132" width="80" height="30" rx="5" class="dc-frame--casambi" stroke-width="1.1"/>
  <text x="262" y="151" text-anchor="middle" class="dc-label dc-label--sm dc-label--casambi">PASARELA CASAMBI</text>

  <line x1="262" y1="162" x2="262" y2="176" class="dc-stroke--casambi" stroke-width="1.2"/>

  <!-- Bluetooth -->
  <rect x="234" y="176" width="56" height="44" rx="5" class="dc-frame--casambi" stroke-width="1"/>
  <g transform="translate(262 194)">
    <path d="M0 -8 L6 -2 L1 -2 L6 5 L1 5 L0 8 L-6 2 L-1 2 L-6 -5 L-1 -5 Z" fill="rgba(0,180,216,0.92)"/>
  </g>
  <text x="262" y="212" text-anchor="middle" class="dc-label dc-label--sm dc-label--casambi">BLUETOOTH</text>

  <line x1="262" y1="220" x2="262" y2="234" class="dc-stroke--casambi" stroke-width="1.2"/>

  <!-- Red inalámbrica -->
  <rect x="222" y="234" width="80" height="148" rx="5" class="dc-frame--casambi" stroke-width="1.1"/>
  <g transform="translate(262 292)">
    <line x1="-34" y1="-14" x2="34" y2="-14" class="dc-stroke--mesh" stroke-width="1"/>
    <line x1="-34" y1="0" x2="34" y2="0" class="dc-stroke--mesh" stroke-width="1"/>
    <line x1="-34" y1="14" x2="34" y2="14" class="dc-stroke--mesh" stroke-width="1"/>
    <line x1="-24" y1="-24" x2="-24" y2="24" class="dc-stroke--mesh" stroke-width="1"/>
    <line x1="0" y1="-24" x2="0" y2="24" class="dc-stroke--mesh" stroke-width="1"/>
    <line x1="24" y1="-24" x2="24" y2="24" class="dc-stroke--mesh" stroke-width="1"/>
    <rect x="-38" y="-20" width="10" height="10" rx="1.5" class="dc-fill-casambi"/>
    <rect x="-14" y="-20" width="10" height="10" rx="1.5" class="dc-fill-casambi"/>
    <rect x="10" y="-20" width="10" height="10" rx="1.5" class="dc-fill-casambi"/>
    <rect x="34" y="-20" width="10" height="10" rx="1.5" class="dc-fill-casambi"/>
    <rect x="-38" y="-6" width="10" height="10" rx="1.5" class="dc-fill-casambi"/>
    <rect x="-14" y="-6" width="10" height="10" rx="1.5" class="dc-fill-casambi"/>
    <rect x="10" y="-6" width="10" height="10" rx="1.5" class="dc-fill-casambi"/>
    <rect x="34" y="-6" width="10" height="10" rx="1.5" class="dc-fill-casambi"/>
    <rect x="-38" y="8" width="10" height="10" rx="1.5" class="dc-fill-casambi"/>
    <rect x="-14" y="8" width="10" height="10" rx="1.5" class="dc-fill-casambi"/>
    <rect x="10" y="8" width="10" height="10" rx="1.5" class="dc-fill-casambi"/>
    <rect x="34" y="8" width="10" height="10" rx="1.5" class="dc-fill-casambi"/>
  </g>
  <text x="262" y="368" text-anchor="middle" class="dc-label dc-label--sm dc-label--casambi">RED INALÁMBRICA</text>
</svg>
